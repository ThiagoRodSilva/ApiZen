[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-zen"
version = "0.2.0"
authors = [
  { name="Thiago", email="trodriguessilva.dev@gmail.com" },
]
description = "Uma biblioteca Python moderna, leve e resiliente para simplificar a interação com APIs REST."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/thiago/minha_biblioteca"

[tool.hatch.build.targets.wheel]
packages = ["src/api_zen"]
